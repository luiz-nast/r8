<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#0C0D0F">
<title>r8</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%230C0D0F'/%3E%3Ctext x='16' y='21.5' font-family='monospace' font-weight='700' font-size='15' text-anchor='middle' fill='%23FFB020'%3Er8%3C/text%3E%3C/svg%3E">
<style>
  @font-face { font-family: Archivo; src: url(/static/fonts/Archivo.woff2) format("woff2"); font-weight: 400 800; font-display: swap; }
  @font-face { font-family: "JetBrains Mono"; src: url(/static/fonts/JetBrainsMono.woff2) format("woff2"); font-weight: 500 700; font-display: swap; }
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 20px; background: #0C0D0F; color: #F2F0EA; font: 15px/1.4 Archivo, system-ui, sans-serif; }
  form { width: 100%; max-width: 340px; display: flex; flex-direction: column; gap: 14px; }
  .logo { font: 700 84px/0.9 "JetBrains Mono", ui-monospace, monospace; letter-spacing: -4px; color: #FFB020; }
  .tag { margin: 0 0 14px; color: #8B8D94; }
  label { display: flex; align-items: center; height: 48px; padding: 0 14px; border-radius: 14px; background: #16171A; border: 1px solid #26282D; }
  label:focus-within { border-color: #FFB020; }
  input { flex: 1; min-width: 0; background: transparent; border: 0; color: inherit; font: inherit; outline: none; }
  button { height: 48px; border: 0; border-radius: 14px; background: #FFB020; color: #0C0D0F; font: 800 15px Archivo, system-ui, sans-serif; cursor: pointer; }
  p#err { margin: 0; min-height: 1.4em; color: #F87171; font-size: 14px; }
  .sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); }
</style>
</head>
<body>
<form method="post" action="/login">
  <div class="logo">r8</div>
  <p class="tag">Seu laboratório de bolsa de valores.</p>
  <label><span class="sr">Senha</span><input type="password" name="password" placeholder="Senha" autocomplete="current-password" autofocus required></label>
  <button>Entrar</button>
  <p id="err" role="alert"></p>
</form>
<script>
  const q = new URLSearchParams(location.search)
  if (q.has("wrong")) err.textContent = "Senha errada."
  if (q.has("blocked")) err.textContent = `Muitas tentativas. Tenta de novo em ${q.get("blocked")} min.`
</script>
</body>
</html>
